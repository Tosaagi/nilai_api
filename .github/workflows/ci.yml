# Pipeline CI layanan nilai
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Bangun dan uji
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v7

      - name: Pasang JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bangun dan uji dengan Maven
        run: mvn -B verify

      - name: Simpan berkas JAR
        uses: actions/upload-artifact@v7
        with:
          name: nilai_api
          path: target/*.jar
