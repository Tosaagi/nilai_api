# Pipeline CI/CD layanan nilai
name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Bangun dan uji
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari repositori
        uses: actions/checkout@v7

      - name: Pasang JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Bangun dan uji dengan Maven
        run: mvn -B verify

      - name: Simpan berkas JAR
        uses: actions/upload-artifact@v7
        with:
          name: nilai_api
          path: target/*.jar

  rilis:
    name: Terbitkan rilis
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Ambil berkas JAR dari job build
        uses: actions/download-artifact@v8
        with:
          name: nilai_api

      - name: Buat rilis di GitHub
        run: gh release create "$GITHUB_REF_NAME" *.jar --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
