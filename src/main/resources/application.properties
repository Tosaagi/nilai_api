# layanan nilai berjalan di port 8082
server.port=8082

# basis data milik layanan nilai sendiri
spring.datasource.url=jdbc:mysql://localhost:3306/nilai_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.indent-output=true
spring.jackson.deserialization.fail-on-null-for-primitives=false

# alamat layanan mahasiswa yang dipanggil oleh layanan nilai
layanan.mahasiswa.url=http://localhost:8081
